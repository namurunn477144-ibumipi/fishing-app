<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>いぶみー フィッシング</title>
  <meta name="color-scheme" content="only light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="いぶみー">
  <meta name="theme-color" content="#2FB0F0">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12324A; --ink-soft: #4D6A80; --sea: #1E88C8; --sea-2: #0E5A96; --sun: #FFC43D; --coral: #FF7A59; --leaf: #3CC48A;
      --card: #FFFFFF; --bg1: #BFE9FF; --bg2: #F2FBFF; --shadow: rgba(14, 70, 110, 0.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: clamp(15px, min(2.3vw, 2.2vh), 24px); }
    html, body { margin: 0; height: 100%; }
    body { font-family: 'M PLUS Rounded 1c', sans-serif; color: var(--ink); background: linear-gradient(180deg, var(--bg1), var(--bg2)); overflow: hidden; user-select: none; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; -webkit-user-select: none; overscroll-behavior: none; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    .screen { position: fixed; inset: 0; display: none; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .screen.show { display: flex; }
    .wrap { width: min(100%, 46rem); margin: 0 auto; padding: 1rem 1rem 2rem; display: flex; flex-direction: column; gap: 0.9rem; }
    .topbar { display: flex; align-items: center; gap: 0.6rem; }
    .topbar h2 { flex: 1; margin: 0; font-size: 1.4rem; font-weight: 900; }
    .round-btn { flex: none; width: 3rem; height: 3rem; border: none; border-radius: 50%; background: #FFF; font-size: 1.4rem; font-weight: 900; box-shadow: 0 6px 14px var(--shadow); display: flex; align-items: center; justify-content: center; }
    .chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 0.8rem; border-radius: 999px; background: #FFF; font-weight: 900; box-shadow: 0 4px 10px var(--shadow); white-space: nowrap; }
    .money { color: #B07800; }
    .btn { border: none; border-radius: 1.2rem; padding: 0.9rem 1rem; font-weight: 900; font-size: 1.15rem; background: #FFF; box-shadow: 0 8px 18px var(--shadow); display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn.primary { color: #FFF; background: linear-gradient(135deg, #2FB0F0, #1272C4); box-shadow: 0 10px 22px -6px #1272C4; }
    .btn.sun { color: #5A3A00; background: linear-gradient(135deg, #FFE27A, #FFB627); }
    .btn.coral { color: #FFF; background: linear-gradient(135deg, #FF9A76, #F2545B); }
    .btn.green { color: #FFF; background: linear-gradient(135deg, #5ED6A0, #1FA772); }
    .btn:disabled { opacity: 0.45; }
    .emo { display: inline-block; width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -0.25em; -webkit-user-drag: none; }
    .card { background: var(--card); border-radius: 1.4rem; box-shadow: 0 10px 24px var(--shadow); padding: 1rem; }

    /* ---------- タイトル ---------- */
    #title { align-items: center; justify-content: center; background: linear-gradient(180deg, #7FD4FF 0%, #C8EEFF 45%, #2E9CC8 46%, #0E5A86 100%); }
    .title-box { width: min(92%, 36rem); text-align: center; display: flex; flex-direction: column; gap: 1rem; }
    .title-box h1 { margin: 0; font-size: 2.6rem; font-weight: 900; color: #FFF; text-shadow: 0 4px 0 #1272C4, 0 8px 20px rgba(0,0,0,0.2); letter-spacing: 0.05em; }
    .title-box .kicker { margin: 0; font-weight: 900; color: #1272C4; }
    .title-fish { height: 7rem; display: flex; justify-content: center; gap: 0.5rem; }
    .title-fish img { height: 100%; animation: bob 3s ease-in-out infinite; }
    .title-fish img:nth-child(2) { animation-delay: -1s; } .title-fish img:nth-child(3) { animation-delay: -2s; }
    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .player { border: none; border-radius: 1.6rem; padding: 1.1rem 0.6rem; background: #FFF; box-shadow: 0 12px 26px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .player .face { font-size: 3rem; line-height: 1; }
    .player b { font-size: 1.4rem; }
    .player small { font-weight: 800; color: var(--ink-soft); }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* ---------- みなと（ホーム）---------- */
    .harbor { position: relative; height: clamp(15rem, 36vh, 30rem); border-radius: 1.6rem; overflow: hidden; box-shadow: 0 12px 26px var(--shadow); background: linear-gradient(180deg, #8FD3FF, #DDF3FF 55%, #2E9CC8 56%, #0E5A86); }
    .harbor .boat { position: absolute; right: 8%; top: 38%; width: 34%; animation: bob 4s ease-in-out infinite; }
    .harbor .pier { position: absolute; left: 0; bottom: 30%; width: 55%; height: 0.9rem; background: repeating-linear-gradient(90deg, #A0703C 0 2.2rem, #8A5C2E 2.2rem 2.4rem); border-radius: 0 0.4rem 0.4rem 0; }
    .harbor .pier::after { content: ''; position: absolute; left: 1rem; right: 1rem; top: 0.9rem; height: 4rem; background: repeating-linear-gradient(90deg, #6E4A24 0 0.6rem, transparent 0.6rem 5rem); }
    .harbor .partner { position: absolute; left: 22%; bottom: calc(30% + 0.6rem); height: 6.5rem; transform-origin: bottom center; cursor: pointer; }
    .harbor .bubble { position: absolute; left: 6%; top: 8%; max-width: 60%; padding: 0.5rem 0.9rem; border-radius: 1rem; background: #FFF; font-weight: 900; box-shadow: 0 6px 14px var(--shadow); }
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .home-grid .btn { flex-direction: column; padding: 1rem 0.5rem; font-size: 1.2rem; }
    .home-grid .btn .big { font-size: 2.4rem; }
    .home-grid .go { grid-column: 1 / -1; font-size: 1.6rem; padding: 1.1rem; flex-direction: row; }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .row .btn { flex: 1; font-size: 1rem; padding: 0.7rem; }
    .stat-row { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

    /* ---------- マップ ---------- */
    .area-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.8rem; }
    .area { position: relative; border: none; text-align: left; border-radius: 1.4rem; padding: 0.9rem; color: #FFF; box-shadow: 0 10px 22px var(--shadow); display: flex; flex-direction: column; gap: 0.2rem; min-height: 8rem; overflow: hidden; }
    .area b { font-size: 1.35rem; } .area small { font-weight: 800; opacity: 0.95; }
    .area .ico { position: absolute; right: 0.6rem; top: 0.4rem; font-size: 2.6rem; }
    .area.locked { filter: grayscale(0.7); }
    .area .lock { margin-top: auto; align-self: flex-start; padding: 0.25rem 0.7rem; border-radius: 999px; background: rgba(0,0,0,0.35); font-weight: 900; }
    .area.sel { outline: 5px solid var(--sun); }
    .methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
    .method { border: none; border-radius: 1.2rem; padding: 0.8rem 0.4rem; background: #FFF; box-shadow: 0 8px 18px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-weight: 900; font-size: 1.1rem; }
    .method .ico { font-size: 2.2rem; }
    .method small { font-size: 0.75rem; color: var(--ink-soft); text-align: center; }
    .method.locked { opacity: 0.45; }
    .method.sel { outline: 4px solid var(--sea); }
    .hint { margin: 0; font-weight: 800; color: var(--ink-soft); text-align: center; }

    /* ---------- つり ---------- */
    #fish { overflow: hidden; touch-action: none; }
    #scene { position: absolute; inset: 0; overflow: hidden; }
    .sky { position: absolute; left: 0; right: 0; top: 0; }
    .sunmoon { position: absolute; border-radius: 50%; }
    .cloud { position: absolute; height: 2.4rem; width: 7rem; border-radius: 999px; background: rgba(255,255,255,0.85); animation: drift linear infinite; }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 3rem; height: 3rem; left: 1rem; top: -1.4rem; } .cloud::after { width: 2.2rem; height: 2.2rem; left: 3.4rem; top: -0.9rem; }
    @keyframes drift { from { transform: translateX(-12rem); } to { transform: translateX(110vw); } }
    .far { position: absolute; left: 0; right: 0; }
    .water { position: absolute; left: 0; right: 0; bottom: 0; }
    .surface { position: absolute; left: -10%; width: 120%; height: 1.2rem; animation: wave 4s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-4%); } }
    .rays { position: absolute; left: 0; right: 0; pointer-events: none; }
    .seabed { position: absolute; left: 0; right: 0; bottom: 0; }
    .weed { position: absolute; bottom: 0; transform-origin: bottom center; animation: sway 3.5s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
    .bubble-dot { position: absolute; width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); animation: rise linear infinite; }
    @keyframes rise { from { transform: translateY(0); opacity: 0.9; } to { transform: translateY(-40vh); opacity: 0; } }
    .night-veil { position: absolute; inset: 0; background: rgba(6, 14, 40, 0.38); pointer-events: none; }
    .fish-sprite { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
    .fish-sprite img { width: 100%; height: 100%; display: block; }
    .fish-sprite .mark { position: absolute; left: 50%; top: -1.6rem; transform: translateX(-50%); font-size: 1.6rem; font-weight: 900; color: #FFF; text-shadow: 0 2px 0 #F2545B, 0 0 6px #F2545B; }
    #lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .pier-el { position: absolute; left: 0; pointer-events: none; }
    .partner-fish { position: absolute; pointer-events: auto; transform-origin: bottom center; }
    .say { position: absolute; padding: 0.5rem 0.9rem; border-radius: 1rem; background: #FFF; font-weight: 900; font-size: 1.1rem; box-shadow: 0 6px 14px var(--shadow); white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .say.show { opacity: 1; }
    .hud { position: absolute; left: 0; right: 0; top: 0; padding: 0.7rem; display: flex; gap: 0.5rem; align-items: center; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .hud .sp { flex: 1; }
    .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; pointer-events: none; }
    .controls > * { pointer-events: auto; }
    .act { min-width: 11rem; min-height: 5.2rem; border: none; border-radius: 2.6rem; font-size: 1.6rem; font-weight: 900; color: #FFF; background: linear-gradient(135deg, #FF9A76, #F2545B); box-shadow: 0 10px 0 #B8323A, 0 16px 26px rgba(0,0,0,0.25); }
    .act:active { transform: translateY(6px); box-shadow: 0 4px 0 #B8323A, 0 8px 16px rgba(0,0,0,0.25); }
    .act.blue { background: linear-gradient(135deg, #4CC2FF, #1272C4); box-shadow: 0 10px 0 #0B4E8A, 0 16px 26px rgba(0,0,0,0.25); }
    .act.wait { background: linear-gradient(135deg, #B8C8D4, #8EA2B2); box-shadow: 0 10px 0 #6E8494, 0 16px 26px rgba(0,0,0,0.25); }
    .act.glow { animation: glow 0.5s ease-in-out infinite alternate; }
    @keyframes glow { from { transform: scale(1); } to { transform: scale(1.1); } }
    .act.hide { visibility: hidden; }
    .reel { position: relative; width: 11rem; height: 11rem; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFFFFF, #C9D6E0 60%, #8EA2B2); box-shadow: 0 12px 26px rgba(0,0,0,0.3), inset 0 0 0 0.5rem rgba(255,255,255,0.5); touch-action: none; }
    .reel .knob-arm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
    .reel .arm { position: absolute; left: -0.45rem; top: -4.4rem; width: 0.9rem; height: 4.4rem; border-radius: 0.45rem; background: #5A6E80; }
    .reel .knob { position: absolute; left: -1.5rem; top: -5.6rem; width: 3rem; height: 3rem; border-radius: 50%; background: linear-gradient(135deg, #FFB627, #F28C00); box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
    .reel .hub { position: absolute; left: 50%; top: 50%; width: 2.6rem; height: 2.6rem; margin: -1.3rem; border-radius: 50%; background: #3E5264; }
    .reel .lbl { position: absolute; left: 0; right: 0; bottom: -1.6rem; text-align: center; font-weight: 900; color: #FFF; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .fight { position: absolute; left: 50%; top: 4.4rem; transform: translateX(-50%); width: min(80%, 26rem); padding: 0.6rem 0.9rem; border-radius: 1.2rem; background: rgba(255,255,255,0.92); box-shadow: 0 8px 20px rgba(0,0,0,0.2); display: none; }
    .fight.show { display: block; }
    .fight .lbl { display: flex; justify-content: space-between; font-weight: 900; }
    .tbar { position: relative; height: 1.3rem; margin-top: 0.3rem; border-radius: 999px; background: linear-gradient(90deg, #5ED6A0 0 60%, #FFD23F 60% 82%, #F2545B 82%); overflow: hidden; }
    .tbar i { position: absolute; top: -0.2rem; bottom: -0.2rem; width: 0.5rem; margin-left: -0.25rem; border-radius: 0.3rem; background: #12324A; box-shadow: 0 0 0 2px #FFF; }
    .dbar { height: 0.8rem; margin-top: 0.4rem; border-radius: 999px; background: #DCEAF3; overflow: hidden; }
    .dbar i { display: block; height: 100%; background: linear-gradient(90deg, #2FB0F0, #1272C4); border-radius: 999px; }
    .power { position: absolute; left: 1rem; bottom: 7.5rem; width: 12rem; height: 1.4rem; border-radius: 999px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 14px rgba(0,0,0,0.2); overflow: hidden; display: none; }
    .power.show { display: block; }
    .power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ED6A0, #FFD23F, #F2545B); }
    .big-msg { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; color: #FFF; text-shadow: 0 4px 0 #F2545B, 0 0 18px rgba(242,84,91,0.8); pointer-events: none; white-space: nowrap; opacity: 0; }
    .splash { position: absolute; width: 4rem; height: 1.4rem; margin: -0.7rem -2rem; border-radius: 50%; border: 3px solid rgba(255,255,255,0.9); pointer-events: none; }

    /* ---------- けっか ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(8, 30, 50, 0.5); padding: 1rem; }
    .modal.show { display: flex; }
    .modal .box { width: min(100%, 34rem); max-height: 94vh; overflow-y: auto; border-radius: 1.8rem; background: #FFF; padding: 1.2rem; box-shadow: 0 24px 60px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 0.7rem; text-align: center; }
    .res-fish { width: 100%; aspect-ratio: 2 / 1; border-radius: 1.2rem; background: radial-gradient(ellipse at center, #E8F7FF, #BFE6FA); display: flex; align-items: center; justify-content: center; }
    .res-fish img { width: 94%; }
    .res-name { margin: 0; font-size: 2rem; font-weight: 900; }
    .res-sub { margin: 0; font-weight: 800; color: var(--ink-soft); }
    .res-size { font-family: 'Fredoka', sans-serif; font-size: 2.4rem; font-weight: 700; color: var(--sea-2); }
    .badges { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
    .badge { padding: 0.25rem 0.7rem; border-radius: 999px; font-weight: 900; font-size: 0.9rem; color: #FFF; background: var(--coral); }
    .badge.new { background: #8F6BFF; } .badge.rec { background: #F2A900; } .badge.shun { background: #1FA772; } .badge.warn { background: #E03131; }
    .ruler { position: relative; height: 1.6rem; border-radius: 0.4rem; background: repeating-linear-gradient(90deg, #FFE7A8 0 calc(10% - 2px), #C9A040 calc(10% - 2px) 10%); }
    .ruler i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0.4rem; background: rgba(30, 136, 200, 0.45); }
    .res-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .res-actions .btn { flex-direction: column; font-size: 1rem; padding: 0.7rem 0.3rem; gap: 0.1rem; }
    .res-actions .btn small { font-size: 0.8rem; opacity: 0.9; }
    .info { margin: 0; text-align: left; font-weight: 800; line-height: 1.6; padding: 0.7rem 0.9rem; border-radius: 1rem; background: #F2FAFF; }

    /* ---------- ずかん ---------- */
    .tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.2rem; }
    .tabs button { flex: none; border: none; padding: 0.5rem 0.9rem; border-radius: 999px; background: #FFF; font-weight: 900; box-shadow: 0 4px 10px var(--shadow); }
    .tabs button.on { color: #FFF; background: var(--sea); }
    .zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.6rem; }
    .zc { border: none; border-radius: 1.1rem; background: #FFF; padding: 0.4rem 0.4rem 0.6rem; box-shadow: 0 6px 14px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 0.1rem; font-weight: 900; }
    .zc .pic { width: 100%; aspect-ratio: 2 / 1; display: flex; align-items: center; justify-content: center; border-radius: 0.8rem; background: #EAF6FD; }
    .zc .pic img { width: 92%; }
    .zc small { font-size: 0.75rem; color: var(--ink-soft); }
    .zc.unk { color: #9AB0C0; }
    .zinfo { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.8rem; text-align: left; font-weight: 800; }
    .zinfo dt { color: var(--ink-soft); } .zinfo dd { margin: 0; }
    .months { display: flex; gap: 2px; } .months span { flex: 1; text-align: center; font-size: 0.7rem; padding: 0.15rem 0; border-radius: 0.3rem; background: #EEF3F6; color: #9AB0C0; }
    .months span.on { background: #1FA772; color: #FFF; }

    /* ---------- おみせ ---------- */
    .shop-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .item { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0.9rem; border-radius: 1.2rem; background: #FFF; box-shadow: 0 6px 14px var(--shadow); }
    .item .ico { font-size: 2.2rem; flex: none; width: 3rem; text-align: center; }
    .item .ico img.fishimg { width: 4.5rem; }
    .item .txt { flex: 1; display: flex; flex-direction: column; font-weight: 900; }
    .item .txt small { font-weight: 800; color: var(--ink-soft); }
    .item .btn { flex: none; padding: 0.6rem 0.9rem; font-size: 1rem; }
    .owned { flex: none; font-weight: 900; color: #1FA772; }
    .picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .pick { border: none; border-radius: 1rem; padding: 0.4rem 0.2rem; background: #F2FAFF; display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 0.85rem; }
    .pick img { width: 4rem; height: 4rem; object-fit: contain; }
    .pick.on { background: linear-gradient(135deg, #FFF3C4, #FFE08A); box-shadow: inset 0 0 0 3px #FFB800; }
    .pick small { font-size: 0.7rem; color: var(--ink-soft); }
    .pick.locked { background: #EEF2F5; }
    .friend { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0.9rem; border-radius: 1.2rem; background: linear-gradient(135deg, #FFF3C4, #FFE08A); font-weight: 900; text-align: left; animation: bob 2s ease-in-out infinite; }
    .friend img { width: 4.5rem; height: 4.5rem; object-fit: contain; }
    .friend b { font-size: 1.3rem; }
    .trip-opts { display: flex; flex-direction: column; gap: 0.6rem; }
    .trip-opts .sub { display: block; margin-top: 0.3rem; font-weight: 800; color: var(--ink-soft); font-size: 0.75rem; }
    .dchips button.lock { background: #EEF2F5; color: #9AB0C0; }
    .home-go { padding: 0.5rem 1rem; font-size: 1.05rem; border-radius: 999px; }
    .trip-scene { position: relative; height: 15rem; border-radius: 1.4rem; background: linear-gradient(180deg, #FFD9A8, #FFB58A 60%, #2E9CC8 61%, #0E5A86); overflow: hidden; }
    .trip-av { position: absolute; left: 8%; bottom: 4%; height: 80%; }
    .trip-pk { position: absolute; right: 10%; bottom: 10%; height: 45%; }
    .trip-say { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); max-width: 70%; padding: 0.5rem 0.9rem; border-radius: 1rem; background: #FFF; font-weight: 900; box-shadow: 0 6px 14px rgba(0,0,0,0.2); }
    .trip-lines p { margin: 0.2rem 0; font-weight: 900; font-size: 1.1rem; }
    .mgrid.small { grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); max-height: 14rem; overflow-y: auto; }
    .tank { position: relative; height: 11rem; border-radius: 1.4rem; overflow: hidden; box-shadow: 0 10px 22px var(--shadow), inset 0 0 0 0.5rem #CDE6F2; background: #DFF3FB; }
    .tank-water { position: absolute; inset: 0.5rem; border-radius: 1rem; overflow: hidden; background: linear-gradient(180deg, #8ED8F2, #2E9CC8); }
    .tank-sand { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: #E8D4A0; border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
    .tank-fish { position: absolute; left: 0; animation: tankswim linear infinite; cursor: pointer; }

<script>
// =========================================================
// ▼▼ さかなの え（SVG を パラメータで えがく）▼▼
//   さかな：からだの かたち・ひれ・いろ・もよう
//   イカ・タコ・ヒラメ（うえから みた かたち）・エビ は べつの かきかた
// =========================================================
const FISH_VB = { w: 440, h: 220, cy: 110, x0: 30, x1: 350 };
let _fid = 0;
const f1 = (n) => (+n).toFixed(1);
function fishBody(sp) {
  const { x0, x1, cy } = FISH_VB, L = x1 - x0, n = 48;
  const prof = (t, a, b, d) => {
    const pk = Math.pow(a / (a + b), a) * Math.pow(b / (a + b), b);
    const f = Math.pow(t, a) * Math.pow(1 - t, b) / pk;
    return sp.ped + (d - sp.ped) * f;
  };
  const top = [], bot = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = x0 + L * t;
    const snout = Math.min(1, t / 0.02);
    top.push([x, cy - prof(t, sp.ta, sp.tb, sp.dt) * snout + (sp.mouthY || 0) * (1 - t)]);
    bot.push([x, cy + prof(t, sp.ba, sp.bb, sp.db) * snout + (sp.mouthY || 0) * (1 - t)]);
  }
  return { top, bot };
}
function smooth(pts) {
  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return d;
}
function yAt(arr, x) {
  for (let i = 0; i < arr.length - 1; i++) if (arr[i + 1][0] >= x) {
    const k = (x - arr[i][0]) / (arr[i + 1][0] - arr[i][0]);
    return arr[i][1] + (arr[i + 1][1] - arr[i][1]) * k;
  }
  return arr[arr.length - 1][1];
}
function fin(edge, from, to, h, opt = {}) {
  const { x0, x1 } = FISH_VB, L = x1 - x0;
  const xa = x0 + L * from, xb = x0 + L * to, dir = edge.dir;
  const ya = yAt(edge.pts, xa), yb = yAt(edge.pts, xb);
  const sweep = opt.sweep ?? 0.35, peak = opt.peak ?? 0.25;
  const tipX = xa + (xb - xa) * peak + h * sweep, tipY = yAt(edge.pts, xa + (xb - xa) * peak) + dir * h;
  const backX = xb + (opt.back ?? 0), backY = yb + dir * h * (opt.backH ?? 0.15);
  return `M${f1(xa)},${f1(ya - dir * 2)} Q${f1(xa + (tipX - xa) * 0.2)},${f1(tipY)} ${f1(tipX)},${f1(tipY)} Q${f1((tipX + backX) / 2)},${f1((tipY + backY) / 2 - dir * h * (opt.concave ?? 0.1))} ${f1(backX)},${f1(backY)} L${f1(xb)},${f1(yb - dir * 2)} Z`;
}
const rnd = (s) => () => (s = (s * 9301 + 49297) % 233280) / 233280;
function svgWrap(inner, defs) {
  return `<svg viewBox="0 0 ${FISH_VB.w} ${FISH_VB.h}" xmlns="http://www.w3.org/2000/svg"><defs>${defs || ''}</defs>${inner}</svg>`;
}
// みずの なかの「かげ」：おなじ え を ひといろで ぬる
function toShadow(svg, color = '#0B2A3C') {
  return svg.replace('<defs>', `<defs><filter id="shd"><feFlood flood-color="${color}"/><feComposite in2="SourceAlpha" operator="in"/></filter>`).replace(/<\/defs>([\s\S]*)<\/svg>$/, '</defs><g filter="url(#shd)">$1</g></svg>');
}

var drawFish = function (sp) {
  if (sp.kind === 'squid') return drawSquid(sp);
  if (sp.kind === 'octo') return drawOcto(sp);
  if (sp.kind === 'flat') return drawFlat(sp);
  if (sp.kind === 'shrimp') return drawShrimp(sp);
  const id = 'f' + (++_fid);
  const { x0, x1, cy } = FISH_VB, L = x1 - x0, ln = sp.line;
  const { top, bot } = fishBody(sp);
  const body = smooth(top) + ' L' + smooth(bot.slice().reverse()).slice(1) + ' Z';
  const H = sp.tailH || 0, tl = sp.tailL || 0, tx = x1 + tl;
  const ty = yAt(top, x1 - 2), by = yAt(bot, x1 - 2);
  let tail = '';
  if (sp.tail === 'lunate') tail = `M${x1 - 8},${ty} Q${x1 + 10},${cy - H * 0.5} ${tx},${cy - H} Q${x1 + tl * 0.45},${cy - H * 0.3} ${x1 + tl * 0.35},${cy} Q${x1 + tl * 0.45},${cy + H * 0.3} ${tx},${cy + H} Q${x1 + 10},${cy + H * 0.5} ${x1 - 8},${by} Z`;
  else if (sp.tail === 'fork') tail = `M${x1 - 8},${ty} Q${x1 + tl * 0.5},${cy - H * 0.55} ${tx},${cy - H} Q${tx - 6},${cy - H * 0.35} ${x1 + tl * 0.48},${cy} Q${tx - 6},${cy + H * 0.35} ${tx},${cy + H} Q${x1 + tl * 0.5},${cy + H * 0.55} ${x1 - 8},${by} Z`;
  else if (sp.tail === 'round') tail = `M${x1 - 8},${ty} L${tx - 8},${cy - H} Q${tx + 8},${cy} ${tx - 8},${cy + H} L${x1 - 8},${by} Z`;
  else if (sp.tail === 'trunc') tail = `M${x1 - 8},${ty} Q${x1 + tl * 0.5},${cy - H * 0.6} ${tx},${cy - H} Q${tx - 8},${cy} ${tx},${cy + H} Q${x1 + tl * 0.5},${cy + H * 0.6} ${x1 - 8},${by} Z`;
  const T = { pts: top, dir: -1 }, B = { pts: bot, dir: 1 };
  const fins = (sp.fins || []).map((f, k) => {
    const e = f.edge === 'top' ? T : B, d = fin(e, f.from, f.to, f.h, f), c = f.color || sp.finColor;
    const xa = x0 + L * f.from, xb = x0 + L * f.to, n = Math.max(4, Math.round((xb - xa) / 7));
    let rays = '';
    for (let i = 0; i <= n; i++) { const x = xa + (xb - xa) * i / n, y = yAt(e.pts, x); rays += `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(x + f.h * (f.sweep ?? 0.35) * 1.6 + 6)}" y2="${f1(y + e.dir * f.h * 1.6)}"/>`; }
    return `<clipPath id="${id}f${k}"><path d="${d}"/></clipPath><path d="${d}" fill="${c}" opacity="${f.op ?? 0.95}"/><g clip-path="url(#${id}f${k})" stroke="${ln}" stroke-width="1" opacity="0.35">${rays}</g><path d="${d}" fill="none" stroke="${ln}" stroke-width="1.4" stroke-linejoin="round"/>`;
  }).join('');
  let tailSvg = '';
  if (tail) {
    let trays = ''; for (let i = 0; i <= 16; i++) { const a = -1 + i / 8; trays += `<line x1="${x1 - 6}" y1="${cy}" x2="${tx + 20}" y2="${f1(cy + a * H * 1.3)}"/>`; }
    tailSvg = `<clipPath id="${id}t"><path d="${tail}"/></clipPath><path d="${tail}" fill="${sp.tailColor || sp.finColor}"/><g clip-path="url(#${id}t)"><g stroke="${ln}" stroke-width="1" opacity="0.3">${trays}</g>${sp.tailDeco ? sp.tailDeco({ x1, cy, tx, H }) : ''}<path d="${tail}" fill="url(#${id}tg)"/></g><path d="${tail}" fill="none" stroke="${ln}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  const ex = x0 + L * sp.eyeX, ey = cy + sp.eyeY;
  let pec = '';
  if (sp.pecL !== 0) {
    const px = x0 + L * (sp.pecX ?? 0.27), py = cy + (sp.pecY ?? 14), pecL = sp.pecL ?? 40;
    const pd = `M${f1(px)},${f1(py - 6)} Q${f1(px + pecL * 0.6)},${f1(py - 11)} ${f1(px + pecL)},${f1(py + 5)} Q${f1(px + pecL * 0.5)},${f1(py + 11)} ${f1(px)},${f1(py + 6)} Z`;
    let prays = ''; for (let i = 0; i < 7; i++) prays += `<line x1="${f1(px)}" y1="${f1(py)}" x2="${f1(px + pecL + 4)}" y2="${f1(py - 10 + i * 4)}"/>`;
    pec = `<clipPath id="${id}p"><path d="${pd}"/></clipPath><path d="${pd}" fill="${sp.pecColor || sp.finColor}" opacity="0.9"/><g clip-path="url(#${id}p)" stroke="${ln}" stroke-width="0.9" opacity="0.4">${prays}</g><path d="${pd}" fill="none" stroke="${ln}" stroke-width="1.2"/>`;
  }
  let gill = '';
  if (sp.gill !== false) {
    const gx = x0 + L * (sp.gillX ?? 0.24);
    const gTop = yAt(top, gx) + 6, gBot = yAt(bot, gx) - 4, gx2 = gx - L * 0.045;
    gill = `<path d="M${f1(gx - 4)},${f1(gTop)} Q${f1(gx + 12)},${f1((gTop + gBot) / 2)} ${f1(gx - 10)},${f1(gBot)}" fill="none" stroke="${ln}" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
<path d="M${f1(gx - 4)},${f1(gTop)} Q${f1(gx + 12)},${f1((gTop + gBot) / 2)} ${f1(gx - 10)},${f1(gBot)} L${f1(gx - 16)},${f1(gBot)} Q${f1(gx + 2)},${f1((gTop + gBot) / 2)} ${f1(gx - 10)},${f1(gTop)} Z" fill="${ln}" opacity="0.10"/>
<path d="M${f1(gx2)},${f1(ey + 6)} Q${f1(gx2 + 4)},${f1(gBot - 14)} ${f1(gx2 - 14)},${f1(gBot - 4)}" fill="none" stroke="${ln}" stroke-width="1.3" opacity="0.35" stroke-linecap="round"/>`;
  }
  const my = cy + (sp.mouthY || 0) + 2, ml = sp.mouth || 0;
  let mouth = ml ? `<path d="M${x0 + 1},${my} q${ml},3 ${f1(ml * 1.7)},1" fill="none" stroke="${ln}" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M${f1(x0 + ml * 0.4)},${my - 4} Q${f1(x0 + ml * 1.2)},${my - 3} ${f1(x0 + ml * 1.8)},${my + 1}" fill="none" stroke="${ln}" stroke-width="1.2" opacity="0.4"/>` : '';
  if (sp.barbel) {
    const bc = sp.barbelColor || ln;
    for (let i = 0; i < sp.barbel; i++) {
      const bl = (sp.barbelL || 24) * (1 - i * 0.25);
      mouth += `<path d="M${x0 + 6 + i * 6},${my + 2} q${-bl * 0.3},${bl * 0.5} ${-bl * 0.4},${bl}" fill="none" stroke="${bc}" stroke-width="${2.4 - i * 0.4}" stroke-linecap="round"/>`;
    }
  }
  const er = sp.eyeR ?? 9, iris = sp.iris || '#D8B45A';
  const eye = `<circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(er + 3)}" fill="${ln}" opacity="0.18"/><circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(er + 1)}" fill="${iris}" stroke="${ln}" stroke-width="1.2"/><circle cx="${f1(ex + 0.5)}" cy="${f1(ey + 0.3)}" r="${f1(er * 0.6)}" fill="#0B0C10"/><ellipse cx="${f1(ex - er * 0.25)}" cy="${f1(ey - er * 0.35)}" rx="${f1(er * 0.28)}" ry="${f1(er * 0.2)}" fill="#FFF" opacity="0.9"/>`;
  const stops = sp.grad.map((c, i) => `<stop offset="${(i / (sp.grad.length - 1)) * 100}%" stop-color="${c}"/>`).join('');
  const ctx = { top, bot, x0, x1, cy, yAt, ex, ey, tx, H, L };
  const over = typeof sp.over === 'function' ? sp.over(ctx) : '';
  const deco = typeof sp.deco === 'function' ? sp.deco(ctx) : '';
  const sc = sp.scale ?? 8;
  const defs = `<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>
<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="0.42" stop-color="#FFF" stop-opacity="0.32"/><stop offset="0.55" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></linearGradient>
<radialGradient id="${id}r" cx="0.42" cy="0.42" r="0.62"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></radialGradient>
<linearGradient id="${id}tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.15"/><stop offset="1" stop-color="#FFF" stop-opacity="0.15"/></linearGradient>
<pattern id="${id}sp" width="${sc}" height="${sc * 0.8}" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><path d="M0,${sc * 0.4} a${sc / 2},${sc * 0.45} 0 0 1 ${sc},0 M${-sc / 2},${sc * 0.8} a${sc / 2},${sc * 0.45} 0 0 1 ${sc},0 M${sc / 2},${sc * 0.8} a${sc / 2},${sc * 0.45} 0 0 1 ${sc},0" fill="none" stroke="${ln}" stroke-width="0.7"/></pattern>
<clipPath id="${id}c"><path d="${body}"/></clipPath>`;
  return svgWrap(`${fins}${tailSvg}
<path d="${body}" fill="url(#${id}g)"/>
<g clip-path="url(#${id}c)">${deco}<rect x="${x0 + L * 0.2}" y="0" width="${L}" height="${FISH_VB.h}" fill="url(#${id}sp)" opacity="${sp.scaleOp ?? 0.22}"/><path d="${body}" fill="url(#${id}s)"/><path d="${body}" fill="url(#${id}r)"/>${gill}</g>
<path d="${body}" fill="none" stroke="${ln}" stroke-width="2"/>
${over}${mouth}${pec}${eye}`, defs);
}

;
// ---------- イカ（あしが ひだり、どうが みぎ）----------
function drawSquid(sp) {
  const id = 'f' + (++_fid), ln = sp.line, cy = 110;
  const mx0 = 160, mx1 = sp.mantleEnd || 410, mw = sp.mantleW || 40;
  // どう（とがった さき）
  const mantle = `M${mx0},${cy - mw} C${mx0 + 90},${cy - mw - 4} ${mx1 - 60},${cy - mw * 0.55} ${mx1},${cy} C${mx1 - 60},${cy + mw * 0.55} ${mx0 + 90},${cy + mw + 4} ${mx0},${cy + mw} Q${mx0 - 12},${cy} ${mx0},${cy - mw} Z`;
  let fins = '';
  if (sp.finType === 'full') fins = `M${mx0 + 10},${cy - mw + 2} C${mx0 + 80},${cy - mw - 40} ${mx1 - 40},${cy - 40} ${mx1 + 6},${cy} C${mx1 - 40},${cy + 40} ${mx0 + 80},${cy + mw + 40} ${mx0 + 10},${cy + mw - 2} Z`;
  else if (sp.finType === 'frill') fins = `M${mx0 + 6},${cy - mw + 1} C${mx0 + 80},${cy - mw - 16} ${mx1 - 30},${cy - mw * 0.5 - 12} ${mx1 + 4},${cy} C${mx1 - 30},${cy + mw * 0.5 + 12} ${mx0 + 80},${cy + mw + 16} ${mx0 + 6},${cy + mw - 1} Z`;
  else fins = `M${mx1 - 70},${cy - mw * 0.45} L${mx1 - 10},${cy - mw - 22} L${mx1 + 8},${cy} L${mx1 - 10},${cy + mw + 22} L${mx1 - 70},${cy + mw * 0.45} Z`;
  // あし 8ほん ＋ しょくわん 2ほん
  let arms = '';
  for (let i = 0; i < 8; i++) {
    const a = (i - 3.5) / 3.5, len = (sp.armL || 90) * (0.75 + 0.25 * (1 - Math.abs(a)));
    const y0 = cy + a * 16, y1 = cy + a * 34 + Math.sin(i * 1.7) * 6;
    arms += `<path d="M125,${f1(y0)} Q${f1(125 - len * 0.5)},${f1(y0 + a * 18)} ${f1(125 - len)},${f1(y1)}" fill="none" stroke="${sp.armColor || sp.grad[1]}" stroke-width="${f1(9 - Math.abs(a) * 2)}" stroke-linecap="round"/>`;
  }
  const tl = sp.tentL || 150;
  const tent = [-1, 1].map(s => `<path d="M122,${cy + s * 6} Q${125 - tl * 0.5},${cy + s * 30} ${125 - tl},${cy + s * 12}" fill="none" stroke="${sp.armColor || sp.grad[1]}" stroke-width="4" stroke-linecap="round"/><ellipse cx="${125 - tl + 6}" cy="${cy + s * 13}" rx="12" ry="5" fill="${sp.armColor || sp.grad[1]}"/>`).join('');
  const head = `M118,${cy - 26} Q150,${cy - 34} 166,${cy - mw * 0.8} L166,${cy + mw * 0.8} Q150,${cy + 34} 118,${cy + 26} Q108,${cy} 118,${cy - 26} Z`;
  const r = rnd(sp.seed || 3); let dots = '';
  for (let i = 0; i < (sp.dots ?? 70); i++) dots += `<circle cx="${f1(mx0 + (mx1 - mx0) * r())}" cy="${f1(cy + (r() - 0.5) * mw * 1.9)}" r="${f1(1 + r() * 2.2)}" fill="${sp.dotColor || '#8A3B2A'}" opacity="0.55"/>`;
  const stops = sp.grad.map((c, i) => `<stop offset="${(i / (sp.grad.length - 1)) * 100}%" stop-color="${c}"/>`).join('');
  const defs = `<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient><clipPath id="${id}c"><path d="${mantle}"/></clipPath>
<radialGradient id="${id}r" cx="0.4" cy="0.35" r="0.7"><stop offset="0.5" stop-color="#FFF" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0.15"/></radialGradient>`;
  return svgWrap(`${tent}${arms}<path d="${fins}" fill="${sp.finColor || sp.grad[2]}" opacity="0.85" stroke="${ln}" stroke-width="1.4"/>
<path d="${mantle}" fill="url(#${id}g)"/><g clip-path="url(#${id}c)">${dots}${sp.deco ? sp.deco({ mx0, mx1, mw, cy }) : ''}<path d="${mantle}" fill="url(#${id}r)"/></g><path d="${mantle}" fill="none" stroke="${ln}" stroke-width="2"/>
<path d="${head}" fill="${sp.grad[1]}" stroke="${ln}" stroke-width="1.8"/>
<circle cx="140" cy="${cy - 8}" r="12" fill="${sp.iris || '#E8E0C8'}" stroke="${ln}" stroke-width="1.4"/><ellipse cx="139" cy="${cy - 8}" rx="5" ry="7" fill="#101114"/><circle cx="136" cy="${cy - 12}" r="2.6" fill="#FFF"/>`, defs);
}

// ---------- タコ ----------
function drawOcto(sp) {
  const id = 'f' + (++_fid), ln = sp.line;
  const head = `M250,118 C232,70 268,22 330,24 C392,26 418,74 404,112 C394,140 352,150 312,146 C286,144 258,140 250,118 Z`;
  let arms = '';
  const r = rnd(sp.seed || 9);
  const order = [0, 7, 1, 6, 2, 5, 3, 4];
  order.forEach((i, n) => {
    const a = i / 7, back = n < 4;
    const sx = 262 + a * 70, sy = 128 + Math.sin(a * Math.PI) * 12;
    const ex = 24 + a * 300 + (r() - 0.5) * 20, ey = 168 + (1 - Math.abs(a - 0.5) * 2) * 30 + (r() - 0.5) * 14;
    const c1x = sx - 10 - a * 10, c1y = sy + 70, c2x = ex + 50 - a * 40, c2y = ey + 30;

};

const spines = (from, to, n, h, c, op = 0.7) => ({ top, x0, x1, yAt }) => { let o = ''; for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * (from + (to - from) * i / (n - 1)), y = yAt(top, x); o += `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(x + 5)}" y2="${f1(y - h)}" stroke="${c}" stroke-width="1.5" opacity="${op}"/>`; } return o; };

// ---------- しゅん・じかん ----------
function seasonOf(month) { return [12, 1, 2].includes(month) ? 'ふゆ' : month <= 5 ? 'はる' : month <= 8 ? 'なつ' : 'あき'; }
function timeOfDay(h) { return h >= 5 && h < 9 ? 'あさ' : h < 16 ? 'ひる' : h < 19 ? 'ゆうがた' : 'よる'; }
function displayName(sp, size) {
  if (!sp.grow) return sp.n;
  const g = sp.grow.find(([lim]) => size < lim);
  return g ? g[1] : sp.n;
}
function sizeRange(sp, area) { return (sp.areaSz && sp.areaSz[area]) || sp.sz; }
function priceOf(sp, size, month) {
  const mid = (sp.sz[0] + sp.sz[1]) / 2;
  const shun = sp.shun && sp.shun.includes(month) ? 1.5 : 1;
  const v = sp.p * Math.pow(size / mid, 2.2) * shun;
  return Math.max(5, Math.round(v / 10) * 10);
}


// ▼▼ よみあげ（こえ）▼▼
const VOICE_PREFS = {
  en: ["Samantha", "Karen", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira"],
  ja: ["Kyoko", "O-Ren", "Google 日本語", "Microsoft Nanami", "Microsoft Haruka"]
};
const VOICE_SETTINGS = { en: { rate: 0.8, pitch: 1.1 }, ja: { rate: 0.95, pitch: 1.1 } };
const hasSpeech = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
let synthVoices = [];
let speechToken = 0;
let speechTimers = [];
let currentUtterance = null; // とちゅうで こえが きえないように さんしょうを もっておく

function loadVoices() { if (hasSpeech) synthVoices = window.speechSynthesis.getVoices(); }
if (hasSpeech) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(lang) {
  if (synthVoices.length === 0) loadVoices();
  const norm = (v) => (v.lang || '').replace('_', '-').toLowerCase();
  const lc = lang.toLowerCase(), base = lc.split('-')[0];
  const matches = synthVoices.filter(v => norm(v).startsWith(base));
  const exact = matches.find(v => norm(v) === lc);
  if (!VOICE_PREFS[lang] && exact) return exact;
  for (const name of (VOICE_PREFS[lang] || [])) {
    const v = matches.find(v => v.name.includes(name));
    if (v) return v;
  }
  const region = lang === 'en' ? 'en-us' : 'ja-jp';
  return matches.find(v => norm(v) === region) || matches[0] || null;
}

function stopSpeech() {
  speechToken++;
  speechTimers.forEach(clearTimeout); speechTimers = [];
  if (hasSpeech && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) window.speechSynthesis.cancel();
}

// parts: [{ text: "...", lang: "en" | "ja", pauseAfter: ミリびょう }]
function speakSequence(parts) {
  if (!hasSpeech || isMuted) return;
  const wasBusy = window.speechSynthesis.speaking || window.speechSynthesis.pending;
  stopSpeech();
  const token = speechToken;
  const list = parts.filter(p => p && p.text && String(p.text).trim());
  const playAt = (i) => {
    if (token !== speechToken || i >= list.length) return;
    const p = list[i];
    const msg = new SpeechSynthesisUtterance(p.text);
    msg.lang = p.lang === 'en' ? 'en-US' : (p.lang === 'ja' ? 'ja-JP' : p.lang);
    const voice = pickVoice(p.lang);
    if (voice) msg.voice = voice;
    const s = VOICE_SETTINGS[p.lang] || { rate: 0.85, pitch: 1.05 };
    msg.rate = s.rate; msg.pitch = s.pitch;
    msg.onend = () => {
      if (token !== speechToken) return;
      speechTimers.push(setTimeout(() => playAt(i + 1), p.pauseAfter || 0));
    };
    currentUtterance = msg;
    window.speechSynthesis.speak(msg);
  };
  // とめた ちょくごに すぐ しゃべると むしされる たんまつが あるので すこし まつ
  if (wasBusy) speechTimers.push(setTimeout(() => playAt(0), 120));
  else playAt(0);
}
function speakText(text, lang) { speakSequence([{ text, lang }]); }
function speakEnglishVoice(text) { speakText(text, 'en'); }
function speakJapaneseVoice(text) { speakText(text, 'ja'); }
// ことばの ( ___ ) を「ま」に して よむ
function speakWithBlank(text, lang) {
  const parts = text.split('( ___ )');
  speakSequence([{ text: parts[0].trim(), lang, pauseAfter: 900 }, { text: (parts[1] || '').trim(), lang }]);
}

function unlockSpeech() {
  document.removeEventListener('touchend', unlockSpeech, true);
  document.removeEventListener('click', unlockSpeech, true);
  if (!hasSpeech || window.speechSynthesis.speaking) return;
  const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
  window.speechSynthesis.speak(u);
}
document.addEventListener('touchend', unlockSpeech, true);
document.addEventListener('click', unlockSpeech, true);

// ---------- こうかおん ----------
let actx = null;
function snd(type) {
  if (isMuted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (f1, f2, st, dur, vol = 0.14, wave = 'triangle') => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = wave;
      o.frequency.setValueAtTime(f1, t + st); o.frequency.exponentialRampToValueAtTime(f2, t + st + dur);
      g.gain.setValueAtTime(0.0001, t + st); g.gain.exponentialRampToValueAtTime(vol, t + st + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + st + dur);
      o.connect(g); g.connect(actx.destination); o.start(t + st); o.stop(t + st + dur + 0.05);
    };
    const noise = (st, dur, vol, freq) => {
      const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol; s.buffer = buf;
      s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t + st);
    };
    if (type === 'cast') { noise(0, 0.35, 0.25, 2400); tone(900, 300, 0, 0.35, 0.05, 'sine'); }
    if (type === 'splash') { noise(0, 0.45, 0.5, 900); tone(300, 120, 0, 0.2, 0.06, 'sine'); }
    if (type === 'tick') tone(1800, 1600, 0, 0.03, 0.05, 'square');
    if (type === 'nibble') tone(420, 260, 0, 0.12, 0.12, 'sine');
    if (type === 'bite') { tone(260, 120, 0, 0.25, 0.2, 'sine'); noise(0, 0.25, 0.3, 700); }
    if (type === 'hit') { tone(520, 1040, 0, 0.12, 0.14); tone(780, 1560, 0.1, 0.18, 0.14); }
    if (type === 'swish') noise(0, 0.22, 0.25, 3000);
    if (type === 'snap') { tone(1400, 200, 0, 0.18, 0.12, 'sawtooth'); }
    if (type === 'coin') { tone(988, 988, 0, 0.08, 0.1, 'square'); tone(1319, 1319, 0.08, 0.22, 0.1, 'square'); }
    if (type === 'catch') { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, i * 0.1, 0.2, 0.12)); tone(1319, 1568, 0.42, 0.5, 0.1, 'sine'); }
    if (type === 'miss') tone(330, 200, 0, 0.35, 0.1);
    if (type === 'tap') tone(660, 880, 0, 0.08, 0.08, 'sine');
  } catch (e) {}
}

const G = { on: false };
let rafId = 0, lastT = 0;
function geo() {

  const surf = H * 0.36, bot = H * 0.93;
  const ah = Math.min(H * 0.19, W * 0.32, 230), aw = ah * 120 / 210, al = W * 0.07, at = surf - ah * 0.985;
  const handX = al + aw * 93 / 120, handY = at + ah * 134 / 210;
  return { W, H, surf, bot, pier: 0.2, ah, aw, al, at, handX, handY, tipX: handX + Math.max(W * 0.1, 70), tipY: handY - H * 0.15, unit: Math.min(W, H * 1.1) };
}
const dpx = (g, d) => g.surf + d * (g.bot - g.surf);
const BANDS = { top: [0.05, 0.3], mid: [0.25, 0.62], bot: [0.62, 0.86] };

// ---------- さかなを だす ----------
function weightOf(sp, month, night) {
  let w = [0, 10, 6, 3, 1.4, 0.5][sp.rare];
  if (typeof G !== 'undefined' && G.bait && sp.rare >= 3) w *= 4;
  if (sp.shun && sp.shun.includes(month)) w *= 2.2;
  if (sp.t === 'night') w *= night ? 2 : 0.35;
  return w;
}
function spawnFish(g) {
  const month = curMonth(), night = timeOfDay(curHour()) === 'よる';
  const pool = poolFor(G.area, G.method);
  const tot = pool.reduce((s, sp) => s + weightOf(sp, month, night), 0);
  let r = Math.random() * tot, sp = pool[0];
  for (const s of pool) { r -= weightOf(s, month, night); if (r <= 0) { sp = s; break; } }
  const [mn, mx] = sizeRange(sp, G.area);
  const size = Math.round((mn + (mx - mn) * Math.pow(Math.random(), 1.7)) * 10) / 10;
  const band = BANDS[sp.band];
  const f = { sp, size, x: rand(0.35, 1.05), d: rand(band[0], band[1]), tx: rand(0.3, 0.95), td: rand(band[0], band[1]), dir: -1, st: 'swim', cool: rand(0, 2), t: Math.random() * 10 };
  const el = document.createElement('div'); el.className = 'fish-sprite';
  const wpx = fishPx(g, sp, size);
  el.style.width = wpx + 'px'; el.style.height = (wpx / 2) + 'px';
  el.innerHTML = `<img src="${fishImg(sp.k, true)}" alt="" style="opacity:0.55">`;
  $('fish-layer').appendChild(el);
  f.el = el; f.w = wpx;
  G.fishes.push(f);
}
function fishPx(g, sp, size) {
  let k = size / 100;
  if (sp.art.kind === 'squid' || sp.art.kind === 'octo') k *= 1.4;
  if (sp.art.kind === 'shrimp') k *= 3;
  return clamp(k * g.unit * 0.42, g.unit * 0.08, g.unit * 0.62);
}
function removeFish(f) { f.el.remove(); G.fishes = G.fishes.filter(x => x !== f); }

// ---------- はじめる ----------
function startFishing(area, method) {
  startTrip(area, method);
  Object.assign(G, { on: true, area, method, bait: useBait(), phase: 'idle', fishes: [], bx: 0.5, bd: 0, t: 0, waitT: 0, reel: 0, reelAcc: 0, held: false, knob: 0, tickAcc: 0, fallT: 0, dip: 0, sink: 0, fight: null, hookFish: null, power: 0, aimT: 0, fly: null, biteT: 0, lastLine: 0 });
  show('fish');
  buildScene(area);
  $('fish-where').textContent = `${AREA_BY[area].icon} ${AREA_BY[area].n}・${METHOD_BY[method].n}`;
  updateMoney(); updateCool();
  layoutPartner();
  const g = geo();
  $('reel').style.display = method === 'ami' ? 'none' : '';
  if (method === 'ami') { for (let i = 0; i < 3; i++) spawnSchool(g); G.net = null; }
  else for (let i = 0; i < 6; i++) spawnFish(g);
  setAct('なげる', 'blue');
  $('fight').classList.remove('show');
  const p = partnerOf();
  setTimeout(() => say(method === 'ami' ? 'さかなの むれを ねらって あみを なげよう！' : method === 'egi' ? 'エギを なげて、うごかして しずめてね！' : method === 'lure' ? 'なげたら ぐるぐる まいてね！' : 'なげて、うきが しずんだら ひっぱってね！'), 400);
  playCry(p.id, 0.35);
  lastT = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function stopLoop() { G.on = false; cancelAnimationFrame(rafId); }

$('fish-back').onclick = () => endTrip();
window.addEventListener('resize', () => { if (G.on) { layoutPartner(); const g = geo(); G.fishes.forEach(f => { f.w = fishPx(g, f.sp, f.size); f.el.style.width = f.w + 'px'; f.el.style.height = f.w / 2 + 'px'; }); } });

function setAct(label, cls, glow) {
  const b = $('act'); b.textContent = label;
  b.className = 'act' + (cls ? ' ' + cls : '') + (glow ? ' glow' : '');
}

// ---------- ボタン ----------
$('act').addEventListener('pointerdown', (e) => { e.preventDefault(); onAct(); });
function onAct() {
  if (!G.on) return;
  const ph = G.phase;
  if (G.method === 'ami') {
    if (ph === 'idle') { G.phase = 'netaim'; setAct('うみを タップ！', 'blue', true); say('むれの ところを タップしてね！', true); }
    else if (ph === 'netpull') netPull();
    return;
  }
  if (ph === 'idle') { G.phase = 'aim'; G.aimT = 0; $('power').classList.add('show'); setAct('いまだ！', '', true); snd('tap'); return; }
  if (ph === 'aim') { doCast(); return; }
  if (ph === 'bite') { hookIt(); return; }
  if (ph === 'wait') {
    if (G.method === 'egi') { shakuri(); return; }
    if (G.method === 'uki') {
      const nib = G.fishes.find(f => f.st === 'nibble');
      if (nib && !save.easy) { nib.st = 'flee'; nib.cool = 4; snd('miss'); say('はやすぎた〜！ うきが しずむまで まってね'); setAct('まってね…', 'wait'); }
      else if (!nib) { G.dip = 0.6; say('うきが しずむまで まってね', false); }
      return;
    }
  }
}
function doCast() {
  const g = geo();
  $('power').classList.remove('show');
  const p = G.power;
  const tx = 0.34 + p * 0.6;
  G.fly = { t: 0, x0: g.tipX / g.W, tx };
  G.phase = 'fly'; setAct('…', '', false); $('act').classList.add('hide');
  snd('cast');
}
function landed() {
  const g = geo();
  G.bx = G.fly.tx; G.bd = 0; G.fly = null;
  splashAt(G.bx * g.W, g.surf, false); snd('splash');
  G.phase = 'wait'; G.waitT = 0; G.dip = 0; G.sink = 0; G.sinkTo = 0; G.fallT = G.method === 'egi' ? 4 : 0;
  $('act').classList.remove('hide');
  if (G.method === 'uki') setAct('まってね…', 'wait');
  else if (G.method === 'egi') setAct('うごかす', 'blue');
  else setAct('まいてね →', 'blue');
  if (G.method === 'lure') $('act').classList.add('hide');
}
function shakuri() {
  G.bd = Math.max(0.04, G.bd - 0.12); G.bx = Math.max(G.pierMin || 0.22, G.bx - 0.03); G.fallT = 3.4; G.jerk = 0.4;
  snd('swish');
  if (G.bx <= 0.24) retrieve();
}
function retrieve() {
  G.phase = 'idle'; G.fishes.forEach(f => { if (f.st !== 'swim') { f.st = 'swim'; f.cool = 1.5; } });
  setAct('なげる', 'blue'); $('act').classList.remove('hide');
}
function hookIt() {
  const f = G.hookFish;
  if (!f) { retrieve(); return; }
  vib(120); snd('hit'); bigMsg('ヒット！');
  startFight(f);
}

// ---------- リール ----------
(function setupReel() {
  const reel = $('reel');
  let lastAng = null;
  const ang = (e) => { const r = reel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  reel.addEventListener('pointerdown', (e) => { e.preventDefault(); reel.setPointerCapture(e.pointerId); lastAng = ang(e); G.held = true; });
  reel.addEventListener('pointermove', (e) => {
    if (lastAng === null) return;
    const a = ang(e); let d = a - lastAng;
    if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
    lastAng = a; G.reelAcc += Math.abs(d); G.knob += d;
  });
  const up = () => { lastAng = null; G.held = false; };
  reel.addEventListener('pointerup', up); reel.addEventListener('pointercancel', up);
})();

// ---------- まいフレーム ----------
function loop(now) {
  if (!G.on) return;
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  G.t += dt;
  const g = geo();
  // リールの はやさ（1びょうに なんかい まわしたか）
  const inst = G.reelAcc / (Math.PI * 2) / Math.max(dt, 0.001); G.reelAcc = 0;
  G.reelRaw = (G.reelRaw || 0) * 0.82 + inst * 0.18;
  let reel = Math.min(3, G.reelRaw);
  if (G.held && reel < 0.45) { reel = 0.45; G.knob += 0.45 * Math.PI * 2 * dt; }
  G.reel = reel;
  G.tickAcc += reel * dt * 4; if (G.tickAcc > 1) { G.tickAcc = 0; snd('tick'); }
  $('knob').style.transform = `rotate(${G.knob}rad)`;

  if (G.phase === 'aim') {
    G.aimT += dt; G.power = (Math.sin(G.aimT * (Math.PI * 2 / 1.5) - Math.PI / 2) + 1) / 2;
    $('power-bar').style.width = (G.power * 100) + '%';
    if (G.aimT > 7.5) doCast();
  } else if (G.phase === 'fly') {
    G.fly.t += dt / 0.7;
    if (G.fly.t >= 1) landed();
  } else if (G.phase === 'wait' || G.phase === 'bite') updateWait(g, dt);
  else if (G.phase === 'fight') updateFight(g, dt);

  if (G.method === 'ami') { updateNet(g, dt); updateSchools(g, dt); }
  else updateFishes(g, dt);
  drawLines(g);
  rafId = requestAnimationFrame(loop);
}

function updateWait(g, dt) {
  G.waitT += dt;
  const m = G.method;
  if (m === 'uki') {
    G.bd = 0.5;
    if (G.reel > 0.3 && G.phase === 'wait') { G.bx -= G.reel * 0.07 * dt; G.fishes.forEach(f => { if (f.st !== 'swim' && f.st !== 'flee') { f.st = 'swim'; f.cool = 1.5; } }); }
  } else if (m === 'lure') {
    if (G.reel > 0.05) { G.bx -= G.reel * 0.085 * dt; const td = clamp(0.62 - G.reel * 0.22, 0.06, 0.8); G.bd += (td - G.bd) * dt * 1.5; }
    else G.bd = Math.min(0.82, G.bd + 0.09 * dt);
  } else if (m === 'egi') {
    if (G.reel > 0.05) G.bx -= G.reel * 0.04 * dt;
    G.bd = clamp(G.bd + (G.jerk > 0 ? -0.35 : 0.2) * dt, 0.03, 0.86);
    G.jerk = Math.max(0, (G.jerk || 0) - dt);
    G.fallT = Math.max(0, G.fallT - dt);
  }
  if (G.bx <= 0.23 && G.phase === 'wait') { retrieve(); return; }
  if (G.phase === 'bite') {
    G.biteT -= dt;
    if (G.biteT <= 0) {
      const f = G.hookFish; G.hookFish = null;
      if (f) { f.st = 'flee'; f.cool = 5; }
      G.sinkTo = 0; G.phase = 'wait'; snd('miss');
      say(m === 'egi' ? 'はなれちゃった… もういちど しゃくってみよう' : 'えさを とられちゃった…');
      setAct(m === 'egi' ? 'うごかす' : 'まってね…', m === 'egi' ? 'blue' : 'wait');
      if (m === 'uki') { G.waitT = 0; }
    }
  }
  // さかなの きょうみ
  G.checkT = (G.checkT || 0) - dt;
  if (G.checkT <= 0 && G.phase === 'wait') {
    G.checkT = 0.4;
    const busy = G.fishes.some(f => f.st === 'chase' || f.st === 'nibble' || f.st === 'hug');
    if (!busy) {
      const cands = G.fishes.filter(f => f.st === 'swim' && f.cool <= 0 && Math.abs(f.x - G.bx) < 0.4);
      let p = 0;
      if (m === 'uki' && G.waitT > 1.2) p = 0.35;
      if (m === 'lure' && G.reel > 0.2 && G.bd > 0.03) p = 0.45;
      if (m === 'egi' && G.bd > 0.15) p = G.fallT > 0 ? 0.6 : 0.15;
      if (cands.length && Math.random() < p) { const f = pick(cands); f.st = 'chase'; f.chaseT = 0; }
    }
  }
}

function updateFishes(g, dt) {
  for (const f of G.fishes.slice()) {
    f.t += dt; f.cool = Math.max(0, f.cool - dt);
    const sp = 0.035 + f.sp.pow * 0.006;
    let tx = f.tx, td = f.td, speed = sp;
    if (f.st === 'swim') {
      if (Math.abs(f.x - f.tx) < 0.02) { const b = BANDS[f.sp.band]; f.tx = rand(0.26, 1.0); f.td = rand(b[0], b[1]); }
    } else if (f.st === 'flee') {
      tx = 1.25; speed = sp * 3;
      if (f.x > 1.15) { removeFish(f); spawnFish(g); continue; }
    } else if (f.st === 'chase' || f.st === 'nibble' || f.st === 'hug') {
      const head = f.w / g.W * 0.5;
      tx = G.bx + head * 0.9; td = G.bd + 0.02; speed = sp * (G.method === 'uki' ? 1.6 : 2.6);
      f.chaseT += dt;
      const near = Math.abs(f.x - tx) < 0.02 && Math.abs(f.d - td) < 0.06;
      if (f.st === 'chase') {
        if (G.method === 'lure') {
          if (G.reel < 0.1) { f.lose = (f.lose || 0) + dt; if (f.lose > 1.6) { f.st = 'swim'; f.cool = 3; f.lose = 0; } } else f.lose = 0;
          if (near && G.reel > 0.12 && Math.random() < dt * 1.6) { G.hookFish = f; f.st = 'hooked'; hookIt(); }
        } else if (G.method === 'uki') {
          if (near) { f.st = 'nibble'; f.nib = 1 + Math.floor(Math.random() * (save.easy ? 2 : 3)); f.nibT = rand(0.5, 1.0); }
        } else if (G.method === 'egi') {
          if (G.fallT <= 0 && f.chaseT > 7) { f.st = 'swim'; f.cool = 2; }
          else if (near && (G.fallT > 0 || Math.random() < dt * 0.5)) { f.st = 'hug'; startBite(f, 'グンッ！ いまだ ひっぱって！'); }
        }
        if (f.chaseT > 9) { f.st = 'swim'; f.cool = 3; }
      } else if (f.st === 'nibble' && G.phase === 'wait') {
        f.nibT -= dt;
        if (f.nibT <= 0) {
          if (f.nib > 0) { f.nib--; f.nibT = rand(0.6, 1.1); G.dip = 0.5; snd('nibble'); }
          else startBite(f, 'いまだ！ ひっぱって！');
        }
      }
    } else if (f.st === 'hooked') { continue; }
    // うごく
    const dx = tx - f.x, dd = td - f.d;
    f.x += clamp(dx, -speed * dt, speed * dt);
    f.d += clamp(dd, -speed * (f.st === 'swim' ? 0.6 : 1.2) * dt, speed * (f.st === 'swim' ? 0.6 : 1.2) * dt);
    if (Math.abs(dx) > 0.004) f.dir = dx > 0 ? 1 : -1;
    placeFish(g, f);
  }
  while (G.fishes.length < 6 && G.phase !== 'fight') spawnFish(g);
}
function placeFish(g, f, extra = '') {
  const x = f.x * g.W - f.w / 2, y = dpx(g, f.d) - f.w / 4 + Math.sin(f.t * 2) * 3;
  f.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scaleX(${f.dir > 0 ? -1 : 1})${extra}`;
  const mark = f.st === 'chase' || f.st === 'nibble' || f.st === 'hug' || f.st === 'hooked';
  if (mark !== !!f.marked) { f.marked = mark; f.el.querySelector('img').style.opacity = mark ? 0.72 : 0.55; }
}
function startBite(f, msg) {
  G.phase = 'bite'; G.hookFish = f; G.biteT = save.easy ? 3.2 : 2.2; G.sinkTo = 1;
  vib(200); snd('bite');
  setAct('ひっぱる！', '', true);
  bigMsg(G.method === 'egi' ? 'グンッ！' : 'いまだ！');
  say(msg, true);
}

// ---------- やりとり ----------
function startFight(f) {
  const g = geo();
  f.st = 'hooked';
  const sp = f.sp, [mn, mx] = sp.sz;
  const sf = clamp((f.size - mn) / Math.max(1, mx - mn), 0, 1);
  const S = sp.pow * (0.65 + 0.35 * sf);
  const dist = 8 + (G.bx - 0.2) * 40 + S * 4;
  G.fight = { f, S, dist, max: dist, stam: 1, run: true, phaseT: 0.8, tension: 0, danger: 0, sayCd: 0, x0: f.x, d0: f.d, floatX: G.bx };
  G.sinkTo = 1;
  G.phase = 'fight';
  $('act').classList.add('hide');
  $('fight').classList.add('show');
  splashAt(f.x * g.W, g.surf, true);
  say(pick(['きたきた！ まいて まいて！', 'おもい！ がんばって！', 'ぐるぐる まいて！']));
}
function updateFight(g, dt) {
  const F = G.fight, rod = RODS[save.rod];
  F.phaseT -= dt; F.sayCd -= dt;
  if (F.phaseT <= 0) {
    F.run = !F.run && Math.random() < 0.35 + F.stam * 0.6;
    F.phaseT = F.run ? rand(0.7, 1.6) * (0.5 + F.stam) : rand(1.3, 2.4);
    if (F.run) { snd('splash'); if (F.f.d < 0.35) splashAt(F.f.x * g.W, g.surf, true); }
  }
  const reel = G.reel;
  const pull = F.run ? (0.2 + F.S * 0.18) * (0.35 + 0.65 * F.stam) : 0.04 + F.S * 0.02;
  let ten = (pull * (reel > 0.15 ? 1 : 0.5) + reel * 0.12) / rod.limit;
  if (save.easy) ten = Math.min(ten, 0.92);
  F.tension += (ten - F.tension) * Math.min(1, dt * 6);
  // ひっぱりすぎると いとが でていく（ドラグ）
  let slip = 0;
  if (F.tension > 0.82) slip = (F.tension - 0.82) * 6;
  const heavy = 0.8 + F.S * 0.32;
  F.dist += (pull * (F.run ? 3.2 : 0.5) + slip - reel * rod.power * 2.7 / heavy * (F.run ? 0.3 : 1)) * dt;
  F.dist = clamp(F.dist, 0, F.max + 25);
  F.stam = Math.max(0, F.stam - dt * (F.run ? 0.05 : 0.02) * (1 + reel * 0.6) * rod.power / (0.4 + F.S * 0.35));
  if (!save.easy && F.tension > 1.0 && reel > 0.5) F.danger += dt; else F.danger = Math.max(0, F.danger - dt * 0.7);
  // ことば
  if (F.sayCd <= 0) {
    if (F.tension > 0.85 && !save.easy) { say('ひっぱられてる！ いまは まかないで！'); F.sayCd = 3; }
    else if (!F.run && reel < 0.2) { say('いまだよ！ まいて まいて！'); F.sayCd = 3.5; }
  }
  $('fight-msg').textContent = F.tension > 0.85 ? (save.easy ? 'がんばれ〜！' : 'あぶない！ ちょっと まって！') : F.run ? 'ひいてる！' : 'まいて まいて！';
  $('fight-dist').textContent = `あと ${Math.ceil(F.dist)}m`;
  $('tension').style.left = (clamp(F.tension, 0, 1.15) / 1.15 * 100) + '%';
  $('dist-bar').style.width = (100 - clamp(F.dist / F.max, 0, 1) * 100) + '%';
  // さかなの いち
  const f = F.f, k = clamp(F.dist / F.max, 0, 1.4);
  // かかった ばしょから すこしずつ てまえ・うえに よってくる（いきなり とばない）
  const tx = 0.25 + (F.x0 - 0.25) * k + Math.sin(G.t * 9) * (F.run ? 0.01 : 0.004);
  const td = clamp(0.06 + (F.d0 - 0.06) * Math.min(1, k) + Math.sin(G.t * 3) * 0.03, 0.03, 0.88);
  const ease = Math.min(1, dt * 2.5);
  f.x += (tx - f.x) * ease; f.d += (td - f.d) * ease;
  F.floatX += (f.x - F.floatX) * Math.min(1, dt * 1.5);
  f.t += dt;
  placeFish(g, f, ` rotate(${Math.sin(G.t * (F.run ? 22 : 8)) * (F.run ? 10 : 4)}deg)`);
  if (F.danger > 1.1) { lineBreak(); return; }
  if (F.dist <= 0.3) landFish();
}
function lineBreak() {
  const F = G.fight; G.fight = null;
  snd('snap'); vib(300); bigMsg('いとが きれた…', '#5A6E80');
  say('あ〜… ざんねん！ つぎは ひかれてる ときは まかないでね');
  F.f.st = 'flee'; F.f.cool = 5;
  $('fight').classList.remove('show');
  G.phase = 'idle'; G.hookFish = null;
  setTimeout(() => { if (G.on) { setAct('なげる', 'blue'); $('act').classList.remove('hide'); } }, 1200);
}
function landFish() {
  const F = G.fight; G.fight = null;
  const g = geo(), f = F.f;
  $('fight').classList.remove('show');
  G.phase = 'land';
  splashAt(f.x * g.W, g.surf, true); snd('splash');
  f.el.querySelector('img').src = fishImg(f.sp.k); f.el.querySelector('img').style.opacity = 1;
  const x0 = f.x * g.W - f.w / 2, y0 = dpx(g, f.d) - f.w / 4;
  const fl = f.dir > 0 ? -1 : 1;
  f.el.animate([{ transform: `translate(${x0}px, ${y0}px) scaleX(${fl})` }, { transform: `translate(${x0 - g.W * 0.04}px, ${g.surf - f.w * 0.6}px) scaleX(${fl}) rotate(10deg)`, offset: 0.45 }, { transform: `translate(${g.tipX - f.w * 0.5}px, ${g.tipY}px) scaleX(${fl}) rotate(-20deg)` }], { duration: 900, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }).onfinish = () => {
    removeFish(f);
    showResult(f);
  };
}

// ---------- いとと さお ----------
function drawLines(g) {
  const svg = $('lines');
  let tipX = g.tipX, tipY = g.tipY;
  const F = G.fight;
  if (F) { tipX += F.tension * g.W * 0.03; tipY += F.tension * g.H * 0.06; }
  if (G.method === 'ami') { svg.innerHTML = drawNet(g); return; }
  const baseX = g.handX - g.W * 0.03, baseY = g.handY + g.H * 0.03;
  const midX = (baseX + tipX) / 2 + (F ? F.tension * 10 : 0), midY = (baseY + tipY) / 2 - 6 + (F ? F.tension * 30 : 0);
  let out = `<path d="M${baseX},${baseY} Q${midX},${midY} ${tipX},${tipY}" stroke="#2A2A30" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M${baseX},${baseY} Q${midX},${midY} ${tipX},${tipY}" stroke="#E8524A" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="40 200"/>`;
  out += `<circle cx="${g.handX - 4}" cy="${g.handY + 6}" r="7" fill="#5A6E80"/>`;
  let ex = null, ey = null;
  if (G.phase === 'fly' && G.fly) {
    const t = G.fly.t, x = (G.fly.x0 + (G.fly.tx - G.fly.x0) * t) * g.W, y = tipY + (g.surf - tipY) * t - Math.sin(t * Math.PI) * g.H * 0.18;
    ex = x; ey = y;
  } else if (G.phase === 'wait' || G.phase === 'bite') {
    ex = G.bx * g.W; ey = G.method === 'uki' ? g.surf : dpx(g, G.bd);
  } else if (F) {
    const f = F.f, tx = f.x * g.W + (f.dir > 0 ? 1 : -1) * f.w * 0.45, ty = dpx(g, f.d) - f.w * 0.04;
    if (F.ex == null) { F.ex = G.bx * g.W; F.ey = dpx(g, G.method === 'uki' ? 0.5 : G.bd); }
    F.ex += (tx - F.ex) * 0.12; F.ey += (ty - F.ey) * 0.12; ex = F.ex; ey = F.ey;
  }
  G.sink = (G.sink || 0) + ((G.sinkTo || 0) - (G.sink || 0)) * 0.12;
  if (ex !== null) {
    const sag = F ? 0 : 30;
    if (F && G.method === 'uki') {
      const fx = F.floatX * g.W, fy = g.surf + G.sink * 30 + Math.sin(G.t * 14) * 3;
      out += `<path d="M${tipX},${tipY} L${fx},${fy}" stroke="#FFF" stroke-width="2" opacity="0.9"/><path d="M${fx},${fy} L${ex},${ey}" stroke="#FFF" stroke-width="1.4" opacity="0.7"/>`;
      out += `<g transform="translate(${fx},${fy})"><ellipse cx="0" cy="0" rx="7" ry="13" fill="#FFF" stroke="#333" stroke-width="1.2"/><path d="M-7,0 A7,13 0 0 1 7,0 Z" fill="#F2545B"/></g>`;
    } else
    out += `<path d="M${tipX},${tipY} Q${(tipX + ex) / 2},${Math.max(tipY, ey) + sag} ${ex},${ey}" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.9"/>`;
    if (G.method === 'uki' && !F) {
      G.dip = Math.max(0, G.dip - 0.03);
      const fy = ey + G.dip * 14 + G.sink * 40 + Math.sin(G.t * (G.sinkTo ? 12 : 3)) * (G.sinkTo ? 4 : 2);
      const hy = dpx(g, 0.5);
      if (G.phase !== 'fly') out += `<line x1="${ex}" y1="${fy}" x2="${ex}" y2="${hy}" stroke="#FFF" stroke-width="1.2" opacity="0.6"/><circle cx="${ex}" cy="${hy}" r="4" fill="#E8B87A"/>`;
      out += `<g transform="translate(${ex},${fy})"><ellipse cx="0" cy="0" rx="7" ry="13" fill="#FFF" stroke="#333" stroke-width="1.2"/><path d="M-7,0 A7,13 0 0 1 7,0 Z" transform="translate(0,-0.5)" fill="#F2545B"/><line x1="0" y1="-13" x2="0" y2="-22" stroke="#333" stroke-width="2"/></g>`;
    } else if (G.method === 'lure' && !F) {
      out += `<g transform="translate(${ex},${ey})"><ellipse cx="6" cy="0" rx="14" ry="5" fill="#C8D8E8" stroke="#2A3A4A" stroke-width="1.2"/><path d="M18,0 l8,-6 l0,12 Z" fill="#E8524A"/><circle cx="-3" cy="-1" r="2" fill="#111"/></g>`;
    } else if (G.method === 'egi' && !F) {
      const ang = G.jerk > 0 ? -35 : 20;
      out += `<g transform="translate(${ex},${ey}) rotate(${ang})"><ellipse cx="8" cy="0" rx="16" ry="6" fill="#FF8A3D" stroke="#8A3A10" stroke-width="1.2"/><path d="M22,0 l9,-7 M22,0 l9,0 M22,0 l9,7" stroke="#8A3A10" stroke-width="1.6"/><path d="M-6,-4 l-6,-6 M-6,4 l-6,6" stroke="#8A3A10" stroke-width="2"/><circle cx="-4" cy="-1" r="2" fill="#111"/></g>`;
    }
  }
  svg.innerHTML = out;
}

// ---------- ずかん ----------
let zukanTab = 'all';
function renderZukan() {

function randSize(k, area) { const [mn, mx] = sizeRange(SP_BY[k], area); return Math.round((mn + (mx - mn) * Math.pow(Math.random(), 1.5)) * 10) / 10; }
function pickWeighted(pool) {
  const month = curMonth(), night = timeOfDay(curHour()) === 'よる';
  const tot = pool.reduce((s, sp) => s + weightOf(sp, month, night), 0);
  let r = Math.random() * tot;
  for (const s of pool) { r -= weightOf(s, month, night); if (r <= 0) return s; }
  return pool[0];
}

function spawnSchool(g) {

  const n = 5 + Math.floor(Math.random() * 7), cx = rand(0.4, 0.95), cd = rand(0.1, 0.45);
  const school = { sp, cx, cd, vx: rand(-0.05, 0.05) || 0.03, t: 0 };
  for (let i = 0; i < n; i++) {
    const size = randSize(sp.k, G.area);
    const f = { sp, size, school, ox: rand(-0.08, 0.08), od: rand(-0.06, 0.06), x: cx, d: cd, dir: -1, st: 'swim', t: Math.random() * 10, cool: 0 };
    const el = document.createElement('div'); el.className = 'fish-sprite';
    f.w = fishPx(g, sp, size); el.style.width = f.w + 'px'; el.style.height = f.w / 2 + 'px';
    el.innerHTML = `<img src="${fishImg(sp.k, true)}" alt="" style="opacity:0.55">`;
    $('fish-layer').appendChild(el); f.el = el; G.fishes.push(f);
  }
}
function updateSchools(g, dt) {
  const schools = [...new Set(G.fishes.map(f => f.school))];
  schools.forEach(s => {
    s.t += dt; s.cx += s.vx * dt; s.cd += Math.sin(s.t * 0.7) * 0.01 * dt;
    if (s.cx < 0.3 || s.cx > 1.0) s.vx *= -1;
    s.cd = clamp(s.cd, 0.06, 0.6);

  G.fishes.forEach(f => {
    if (f.st === 'net') return;
    f.t += dt; f.x = f.school.cx + f.ox + Math.sin(f.t * 1.3) * 0.01; f.d = f.school.cd + f.od + Math.cos(f.t) * 0.01;
    f.dir = f.school.vx > 0 ? 1 : -1; placeFish(g, f);
  });
  if (schools.length < 3 && G.phase !== 'netpull') spawnSchool(g);
}
function netTap(e) {

  const x = (e.clientX - r.left) / g.W, y = e.clientY - r.top;
  if (y < g.surf - 10) return;

  setAct('…', ''); $('act').classList.add('hide');
}
$('scene').addEventListener('pointerdown', netTap);
function updateNet(g, dt) {
  const N = G.net; if (!N) return;
  if (G.phase === 'netfly') { N.t += dt / 0.6; if (N.t >= 1) { G.phase = 'netsink'; N.t = 0; splashAt(N.x * g.W, g.surf, true); snd('splash'); } }
  else if (G.phase === 'netsink') {

      N.caught = G.fishes.filter(f => Math.abs(f.x - N.x) < 0.12 && f.d < N.d + 0.05).sort((p, q) => Math.abs(p.x - N.x) - Math.abs(q.x - N.x)).slice(0, save.easy ? 6 : 5);
      N.caught.forEach(f => { f.st = 'net'; });
      G.phase = 'netpull'; setAct('ひっぱる！', '', true); $('act').classList.remove('hide');
      say(N.caught.length ? 'はいった！ ひっぱって！' : 'ひっぱって あげてみよう！');
    }
  } else if (G.phase === 'netpull') {

  }
}
function netPull() {

    showMulti(items, 'あみを あげた！', () => { if (tripDone()) { endTrip(true); return; } if (G.on) { G.phase = 'idle'; setAct('なげる', 'blue'); $('act').classList.remove('hide'); } });

function drawNet(g) {

  let mesh = ''; for (let i = -4; i <= 4; i++) mesh += `<line x1="${cx + i * w / 4}" y1="${top}" x2="${cx + i * w / 4 * 0.8}" y2="${bot}" />`;
  for (let j = 1; j <= 5; j++) { const y = top + (bot - top) * j / 5; mesh += `<line x1="${cx - w * (1 - j * 0.04)}" y1="${y}" x2="${cx + w * (1 - j * 0.04)}" y2="${y}"/>`; }
  return `<path d="M${g.W * 0.12},${g.surf - g.H * 0.08} Q${(cx + g.W * 0.12) / 2},${g.surf} ${cx},${top}" stroke="#FFF" stroke-width="2" fill="none"/><path d="M${cx - w},${top} L${cx + w},${top} L${cx + w * 0.8},${bot} Q${cx},${bot + 20} ${cx - w * 0.8},${bot} Z" fill="rgba(255,255,255,0.12)" stroke="#FFF" stroke-width="2"/><g stroke="#FFF" stroke-width="1" opacity="0.6">${mesh}</g>`;
}

const C = {};
function startCook(rk, idx) {

}
function renderSteps() {

}
function nextStep() {

  if (C.step >= C.R.steps.length) { finishCook(); return; }
  const s = C.R.steps[C.step];

}
function cookMsg(t) { $('cook-msg').textContent = t; }
function board(inner, cls = '') { return `<div class="board ${cls}">${inner}</div>`; }
function progressBar(id) { return `<div class="cbar"><i id="${id}"></i></div>`; }

// ゆびで こする（うろこ・あらう・ほぐす）
function rubStep(st, done, img, label, fx) {
  cookMsg(label);
  st.innerHTML = board(`<img class="cimg" src="${img}" alt="" draggable="false"><div class="sparkles" id="spk"></div>`) + progressBar('rb');
  const cells = new Set(); let last = 0;
  st.onpointermove = (e) => {
    if (e.buttons === 0 && e.pointerType === 'mouse') return;
    const r = st.querySelector('.board').getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    cells.add(Math.floor((e.clientX - r.left) / r.width * 10) + ',' + Math.floor((e.clientY - r.top) / r.height * 5));
    const now = performance.now();
    if (now - last > 90) { last = now; burst(e.clientX, e.clientY, { count: 2, spread: 30, shapes: fx.shapes || [''], colors: fx.colors }); if (Math.random() < 0.3) snd('tick'); }
    const p = Math.min(1, cells.size / 26); $('rb').style.width = p * 100 + '%';
    if (p >= 1 && !st._done) { st._done = true; done(1); }
  };
}
// タイミング（やく・あげる・にる）
function timingStep(st, done, opts) {
  cookMsg(opts.msg);
  st.innerHTML = board(opts.scene, 'dark') + `<div class="gauge"><i class="zone" style="left:${opts.z0 * 100}%;width:${(opts.z1 - opts.z0) * 100}%"></i><i class="needle" id="needle"></i></div><button class="act" id="tbtn">${opts.btn}</button>`;
  let t = 0, last = performance.now(), times = opts.times || 1, results = [], live = true;
  const speed = save.easy ? 0.32 : 0.45;
  const tick = (now) => {
    if (!live) return;
    t += (now - last) / 1000 * speed; last = now;
    const v = t % 2 < 1 ? t % 1 : 1 - (t % 1);
    $('needle').style.left = v * 100 + '%'; st._v = v;
    if (opts.onTick) opts.onTick(v);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  $('tbtn').onpointerdown = (e) => {
    e.preventDefault(); if (!live) return;
    const v = st._v, mid = (opts.z0 + opts.z1) / 2, w = (opts.z1 - opts.z0) / 2;
    const sc = v >= opts.z0 && v <= opts.z1 ? 1 : clamp(1 - (Math.abs(v - mid) - w) * 3, 0.3, 0.9);
    results.push(sc);
    cookMsg(sc >= 1 ? 'ばっちり！' : v < opts.z0 ? 'ちょっと はやかった' : 'ちょっと こげちゃった');
    snd(sc >= 1 ? 'hit' : 'tap'); burst(e.clientX, e.clientY, { count: sc >= 1 ? 12 : 5, spread: 60 });
    if (opts.onHit) opts.onHit(results.length);
    if (results.length >= times) { live = false; setTimeout(() => done(results.reduce((a, b) => a + b, 0) / results.length), 500); }
    else t = 0;
  };
}
// ゆびで ぐるぐる（まぜる）
function circleStep(st, done, scene, label) {
  cookMsg(label);
  st.innerHTML = board(scene, 'round') + progressBar('cb');
  const b = st.querySelector('.board'); let lastA = null, acc = 0;
  const ang = (e) => { const r = b.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2); };
  st.onpointerdown = (e) => { lastA = ang(e); };
  st.onpointermove = (e) => {
    if (lastA === null) return;
    const a = ang(e); let d = a - lastA; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; lastA = a; acc += Math.abs(d);
    const spoon = $('spoon'); if (spoon) spoon.style.transform = `rotate(${a}rad)`;
    const p = Math.min(1, acc / (Math.PI * 2 * 3)); $('cb').style.width = p * 100 + '%';
    if (Math.random() < 0.1) snd('tick');
    if (p >= 1 && !st._done) { st._done = true; done(1); }
  };
  st.onpointerup = () => { lastA = null; };
}
// なぞる（さばく）
function filletStep(st, done) {

  const svg = st.querySelector('svg');

                 <path d="M150,70 C230,56 320,74 370,96 C320,120 230,122 150,112 Z" fill="${m1}" stroke="${shade(m1, -0.2)}" stroke-width="2"/><path d="M160,86 q90,-10 190,12" stroke="${m2}" stroke-width="5" fill="none" opacity="0.7"/>

  const svg = st.querySelector('svg'); const cut = new Set(); let start = null;

    if (!start) return;

function coatStep(st, done, order) {

  const shuffled = all.slice().sort(() => Math.random() - 0.5);
  let i = 0, miss = 0;
  cookMsg(order.length === 3 ? `じゅんばんに つけてね：${order.join(' → ')}` : `${order[0]}を つけてね`);
  const bowlCol = { 'こむぎこ': '#FFFFFF', 'たまご': '#FFD23F', 'パンこ': '#F2C878', 'かたくりこ': '#FFFFFF', 'てんぷらこ': '#FFF0C8' };
  st.innerHTML = board(`<img class="cimg small" src="${pieceImg()}" alt="" id="coat-fish">`) + `<div class="bowls">${shuffled.map(b => `<button class="bowl" data-b="${b}"><i style="background:${bowlCol[b]}"></i>${b}</button>`).join('')}</div>`;
  st.querySelectorAll('.bowl').forEach(btn => btn.onpointerdown = (e) => {
    e.preventDefault();
    if (btn.dataset.b === order[i]) {
      i++; snd('hit'); btn.classList.add('used'); burst(e.clientX, e.clientY, { count: 8, spread: 40, shapes: [''], colors: [bowlCol[btn.dataset.b], '#FFF'] });
      $('coat-fish').style.filter = `sepia(${i * 0.25}) brightness(${1 + i * 0.05})`;
      if (i >= order.length && !st._done) { st._done = true; cookMsg('ころもが ついた！'); setTimeout(() => done(Math.max(0.5, 1 - miss * 0.2)), 600); }
      else cookMsg(`つぎは ${order[i]}！`);
    } else if (!btn.classList.contains('used')) { miss++; snd('miss'); btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 }); cookMsg(`ちがうよ、${order[i]}だよ`); }
  });
}

// たこやき：きつねいろの ときに タップで くるっ
function takoStep(st, done) {
  cookMsg('きつねいろに なった たこやきを タップで くるっと まわしてね');
  st.innerHTML = board(`<div class="tako-pan">${Array.from({ length: 6 }, (_, i) => `<button class="tball" data-i="${i}"></button>`).join('')}</div>`, 'dark');
  const balls = [...st.querySelectorAll('.tball')].map(el => ({ el, t: -rand(0, 2), done: false }));
  let last = performance.now(), live = true, score = 0;
  const tick = (now) => {
    if (!live) return;
    const dt = (now - last) / 1000; last = now;
    balls.forEach(b => { if (b.done) return; b.t += dt * (save.easy ? 0.22 : 0.3); const v = clamp(b.t, 0, 1.4); b.el.style.background = v < 0.6 ? `radial-gradient(circle at 35% 35%, #FFF8E0, #F2E2A0)` : v < 1 ? `radial-gradient(circle at 35% 35%, #F8D88A, #C8862A)` : `radial-gradient(circle at 35% 35%, #8A5A2A, #3A2010)`; b.el.classList.toggle('ready', v >= 0.6 && v < 1); });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  balls.forEach(b => b.el.onpointerdown = (e) => {
    e.preventDefault(); if (b.done || b.t < 0.2) return;
    b.done = true; const v = b.t; const sc = v >= 0.6 && v < 1 ? 1 : 0.5; score += sc;
    b.el.classList.remove('ready'); b.el.classList.add('turned'); snd(sc === 1 ? 'hit' : 'tap'); burst(e.clientX, e.clientY, { count: 6, spread: 40 });
    if (balls.every(x => x.done)) { live = false; setTimeout(() => done(score / balls.length), 500); }
  });
}

const EMOJI_RE = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator}{2}|[0-9#*]\uFE0F?\u20E3)(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*/gu;
function emojiSrc(e) {
  const p = EMOJI_IMG[e] || EMOJI_IMG[e.replace(/\uFE0F/g, '')] || EMOJI_IMG[e + '\uFE0F'];
  return p ? EMOJI_BASE + encodeURI(p) : null;
}
function emojify(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) { EMOJI_RE.lastIndex = 0; if (EMOJI_RE.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
  nodes.forEach(node => {
    const frag = document.createDocumentFragment();
    let last = 0; const text = node.nodeValue;
    text.replace(EMOJI_RE, (m, offset) => {
      const src = emojiSrc(m);
      if (!src) return m;
      if (offset > last) frag.appendChild(document.createTextNode(text.slice(last, offset)));
      const img = document.createElement('img');
      img.className = 'emo'; img.src = src; img.alt = m; img.draggable = false;
      img.onerror = () => { img.replaceWith(document.createTextNode(m)); }; // よみこめなかったら もとの えもじ
      frag.appendChild(img);
      last = offset + m.length;
      return m;
    });
    if (last === 0) return;
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  });
}
